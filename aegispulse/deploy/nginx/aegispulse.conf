# AegisPulse reverse proxy (Nginx 1.18+). Install as /etc/nginx/sites-available/aegispulse.conf
# Replace aegispulse.example with your domain (see DEPLOYMENT.md, step 6), then run certbot.
#
#   app.aegispulse.example  -> dashboard (Next.js, 127.0.0.1:3000)
#   api.aegispulse.example  -> API for SIEM/SOAR integrations and tenant API keys (FastAPI, 127.0.0.1:8000)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=aegis_login:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=aegis_api:10m rate=600r/m;

# ----------------------------------------------------------------------------- dashboard
server {
    listen 80;
    listen [::]:80;
    server_name app.aegispulse.example;

    client_max_body_size 128k;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Login: tighter limit on top of the application's per-IP/per-email limits.
    location = /api/auth/login {
        limit_req zone=aegis_login burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aegispulse-proxy.conf;
    }

    # Server-Sent Events: no buffering, long-lived connection.
    location = /api/backend/stream {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        include /etc/nginx/snippets/aegispulse-proxy.conf;
    }
}

# ----------------------------------------------------------------------------- API
server {
    listen 80;
    listen [::]:80;
    server_name api.aegispulse.example;

    client_max_body_size 128k;
    server_tokens off;

    location / {
        limit_req zone=aegis_api burst=100 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/aegispulse-proxy.conf;
    }
}
