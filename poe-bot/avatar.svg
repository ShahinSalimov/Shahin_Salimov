<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="1" stop-color="#0d0d0f"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0d08f"/>
      <stop offset="1" stop-color="#b98a3e"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <!-- clapperboard top -->
  <g transform="translate(232 300) rotate(-9)">
    <rect x="0" y="0" width="560" height="96" rx="16" fill="#f4f2ee"/>
    <g fill="#0d0d0f">
      <polygon points="40,0 110,0 70,96 0,96"/>
      <polygon points="180,0 250,0 210,96 140,96"/>
      <polygon points="320,0 390,0 350,96 280,96"/>
      <polygon points="460,0 530,0 490,96 420,96"/>
    </g>
  </g>
  <!-- board body -->
  <rect x="232" y="420" width="560" height="360" rx="28" fill="#f4f2ee"/>
  <rect x="232" y="420" width="560" height="22" fill="url(#gold)"/>
  <!-- play button -->
  <circle cx="512" cy="612" r="118" fill="#0d0d0f"/>
  <polygon points="478,548 478,676 588,612" fill="url(#gold)"/>
</svg>
