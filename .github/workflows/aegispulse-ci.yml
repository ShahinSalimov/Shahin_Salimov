name: AegisPulse CI

on:
  push:
    paths: ["aegispulse/**", ".github/workflows/aegispulse-ci.yml"]
  pull_request:
    paths: ["aegispulse/**", ".github/workflows/aegispulse-ci.yml"]

permissions:
  contents: read

concurrency:
  group: aegispulse-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: aegispulse

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: aegis
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: aegispulse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aegis -d aegispulse"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: aegispulse/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Tests (mocked Anthropic API, SQLite)
        run: pytest -q
      - name: Migrations on PostgreSQL + pgvector (upgrade, drift check, downgrade, upgrade)
        env:
          DATABASE_URL: postgresql+asyncpg://aegis:ci-password@localhost:5432/aegispulse
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Dependency vulnerability audit
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r backend/requirements.txt --strict

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegispulse/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: aegispulse/frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency vulnerability audit (production deps)
        run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f docker/backend.Dockerfile -t aegispulse/backend:ci .
          docker build -f docker/frontend.Dockerfile -t aegispulse/frontend:ci .
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
