<!doctype html><html lang="az"><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{height:100vh;background:radial-gradient(ellipse at 30% 80%,#1e293b 0,#0f172a 55%,#0b1120 100%);font-family:Inter,system-ui,sans-serif;color:#fff;display:grid;place-items:center;overflow:hidden}
.grid{position:absolute;inset:0;background-image:linear-gradient(rgba(250,204,21,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(250,204,21,.06) 1px,transparent 1px);background-size:64px 64px;mask-image:radial-gradient(ellipse at center,#000 20%,transparent 75%)}
.wrap{position:relative;text-align:center;max-width:1300px;padding:0 40px}
.eyebrow{font-size:24px;letter-spacing:6px;text-transform:uppercase;color:#facc15;font-weight:700;opacity:0;animation:up .7s .2s forwards}
h1{font-size:76px;line-height:1.1;font-weight:900;letter-spacing:-2px;margin-top:26px;opacity:0;transform:translateY(30px);animation:up .9s .5s ease-out forwards;text-wrap:balance}
h1 span{color:#facc15}
.list{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:44px}
.chip{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);padding:13px 24px;border-radius:999px;font-size:23px;font-weight:600;color:#e2e8f0;opacity:0;transform:translateY(16px)}
.chip:nth-child(1){animation:up .5s 1.2s forwards}.chip:nth-child(2){animation:up .5s 1.35s forwards}.chip:nth-child(3){animation:up .5s 1.5s forwards}.chip:nth-child(4){animation:up .5s 1.65s forwards}.chip:nth-child(5){animation:up .5s 1.8s forwards}
.cta{display:inline-block;margin-top:56px;background:#facc15;color:#0f172a;font-size:34px;font-weight:800;padding:24px 56px;border-radius:22px;box-shadow:0 20px 60px rgba(250,204,21,.35);opacity:0;transform:scale(.9);animation:pop .7s 2.3s cubic-bezier(.2,.9,.3,1.3) forwards}
.name{margin-top:34px;font-size:26px;color:#94a3b8;font-weight:500;opacity:0;animation:up .7s 2.8s forwards}
@keyframes pop{to{opacity:1;transform:none}}@keyframes up{to{opacity:1;transform:none}}
</style></head><body><div class="grid"></div><div class="wrap">
<div class="eyebrow">Sizin biznesiniz üçün</div>
<h1>Hər növ <span>biznes idarəetmə sistemlərinin</span> hazırlanması</h1>
<div class="list"><div class="chip">Taksi və avtopark</div><div class="chip">Mağaza və anbar</div><div class="chip">Topdan satış</div><div class="chip">Restoran və kafe</div><div class="chip">Xidmət biznesləri</div></div>
<div class="cta">Müraciət edin</div>
<div class="name">Şahin Səlimov · AI və biznes sistemləri</div>
</div></body></html>
